<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - RentGo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="img/logo-rentgo.png" alt="RentGo">
            </a>

            <button class="menu-toggle" aria-label="Abrir menu" aria-expanded="false">☰</button>
            <nav id="menu">
                <a href="index.html">Início</a>
                <a href="frota.html">Frota</a>
                <a href="locais.html">Locais</a>
                <a href="como-funciona.html">Como funciona</a>
                <a href="apoio.html">Apoio</a>
            </nav>
            <a href="entrar.html" class="btn-entrar">Entrar</a>
        </div>
    </header>

    <main class="container" style="flex: 1; display: flex; align-items: center; justify-content: center;">
        <div class="search-box" style="width: 100%; max-width: 400px;">
            <h2 style="color: var(--primary); margin-bottom: 6px; text-align: center;">Bem-vindo à RentGo</h2>
            <p style="color: var(--text-muted); font-size: 13px; text-align: center; margin-bottom: 20px;">Acede à tua área para gerir reservas.</p>
            
            <form>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email" placeholder="exemplo@email.pt" required>
                </div>

                <div class="form-group">
                    <div class="label-linha">
                        <label for="password">Palavra-passe</label>
                        <a href="#" class="link-esqueceu">Esqueceu-se?</a>
                    </div>
                    <div class="campo-password">
                        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" required>
                        <button type="button" id="mostrar-password" class="btn-mostrar">Mostrar</button>
                    </div>
                </div>

                <label class="check-linha">
                    <input type="checkbox" id="manter-sessao" name="manter-sessao"> Manter sessão iniciada
                </label>

                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 16px;">Entrar</button>
            </form>
            
            <p style="font-size: 12px; text-align: center; margin-top: 15px; color: var(--text-muted);">
                Ainda não tens conta? <a href="#" style="color: var(--accent); font-weight: 600;">Regista-te aqui</a>
            </p>
        </div>
    </main>


    <script src="js/script.js"></script>

</body>
</html>
